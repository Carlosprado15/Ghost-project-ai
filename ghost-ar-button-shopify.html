<!-- Ghost Project AI - Botão Ver em AR -->
{% assign ghost_base_url = "https://ghost-project-ai-bbvc.vercel.app" %}
{% assign product_url = shop.url | append: product.url %}

<div class="ghost-ar-container" style="margin: 16px 0;">
  <a 
    href="{{ ghost_base_url }}?productId={% raw %}{{ product.metafields.ghost.product_id }}{% endraw %}&productUrl={{ product_url | url_encode }}&cartUrl={{ shop.url | append: '/cart' | url_encode }}&embedded=true"
    class="ghost-ar-btn"
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 14px;
      background: #000;
      color: #fff;
      border: 1px solid #333;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.05em;
      text-decoration: none;
      cursor: pointer;
    "
  >
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M12 2L2 7l10 5 10-5-10-5z"/>
      <path d="M2 17l10 5 10-5"/>
      <path d="M2 12l10 5 10-5"/>
    </svg>
    Ver em Realidade Aumentada
  </a>
  <p style="text-align:center; font-size:11px; color:#888; margin-top:6px;">
    Powered by Ghost Project AI
  </p>
</div>
